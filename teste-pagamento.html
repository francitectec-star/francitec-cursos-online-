<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Pagamento - Francitec</title>
</head>

<body style="font-family: Arial; text-align: center; padding: 40px;">

  <h1>Francitec</h1>

  <h2>Teste de Pagamento</h2>

  <p>Esta página está ligada à API de pagamentos.</p>

  <button onclick="testarPagamento()"
          style="padding: 15px 25px; font-size: 18px;">
    TESTAR PAGAMENTO
  </button>

  <div id="resultado" style="margin-top: 30px; white-space: pre-wrap;"></div>

<script>

async function testarPagamento() {

  const resultado = document.getElementById("resultado");

  resultado.innerHTML = "⏳ A conectar à API...";

  try {

    const resposta = await fetch(
      "https://francitec-payments-api.onrender.com/test-payment",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          amount: 100,
          student: "Aluno de teste"
        })
      }
    );

    const texto = await resposta.text();

    resultado.innerHTML =
      "Código HTTP: " + resposta.status +
      "\n\nResposta da API:\n" +
      texto;

  } catch (erro) {

    resultado.innerHTML =
      "❌ ERRO DE CONEXÃO\n\n" +
      erro.message;

  }

}

</script>

</body>
</html>
